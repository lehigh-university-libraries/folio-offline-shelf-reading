name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'environment to deploy to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
jobs:
  run:
    uses: lehigh-university-libraries/gha/.github/workflows/linderman-deploy.yaml@e26d86abfbe300be4d93570b666651c11471995b # main
    with:
      url: https://apps-${{ inputs.environment }}.lib.lehigh.edu/_rollout
    permissions:
      contents: read
      id-token: write
